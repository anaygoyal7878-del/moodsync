  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body { background: var(--paper); color: var(--ink); font-family: var(--serif); overflow: hidden; -webkit-font-smoothing: antialiased; touch-action: manipulation; }
  button, input { font: inherit; color: inherit; }

  .sc { font-variant-caps: all-small-caps; letter-spacing: .09em; }

  /* ---------- Ledger (top) ---------- */

    background: var(--paper-2); border-bottom: 3px double var(--ink); }

  .who { display: flex; align-items: center; gap: 10px; }

  .portrait svg { display: block; width: 100%; height: 100%; }
  .kicker { font-size: .78rem; color: var(--ink-3); font-variant-caps: all-small-caps; letter-spacing: .1em; line-height: 1.1; }
  .pname { font-weight: 700; font-size: 1.02rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; line-height: 1.2; }
  .trip .row { display: flex; justify-content: space-between; gap: 10px; font-size: .9rem; line-height: 1.35; white-space: nowrap; }
  .trip .row span:first-child { color: var(--ink-3); font-variant-caps: all-small-caps; letter-spacing: .1em; }
  .trip .row b { font-weight: 700; overflow: hidden; text-overflow: ellipsis; }
  .trip.bump b { animation: ink .6s var(--ease); }
  @keyframes ink { 30% { color: var(--red); } }
  .supplies { display: grid; grid-template-columns: repeat(4, 1fr); gap: 14px; align-items: end; }
  .r { position: relative; }
  .r-top { display: flex; justify-content: space-between; align-items: baseline; gap: 6px; }
  .r-name .short { display: none; }
  .r-name { font-size: .8rem; color: var(--ink-2); font-variant-caps: all-small-caps; letter-spacing: .08em; white-space: nowrap; }
  .r-val { font-size: 1.12rem; font-weight: 700; font-variant-numeric: lining-nums tabular-nums; transition: color .3s; }
  .r-bar { position: relative; height: 7px; margin-top: 3px; border: 1px solid var(--ink); background: var(--paper); }

  .r[data-k="duty"] .r-fill { background: var(--gold); }
  .r.up .r-val { color: var(--green); }
  .r.down .r-val { color: var(--red); }
  .r.low .r-val { color: var(--red); }
  .r.low .r-name::after { content: " low"; color: var(--red); font-weight: 700; animation: blink 1s steps(2) infinite; }
  @keyframes blink { 50% { opacity: 0; } }
  .delta { position: absolute; right: 0; top: 100%; margin-top: 4px; font-style: italic; font-weight: 700; font-size: .85rem; pointer-events: none; animation: rise 1.2s var(--ease) forwards; }
  .delta.up { color: var(--green); } .delta.down { color: var(--red); }
  @keyframes rise { 0% { opacity: 0; transform: translateY(6px); } 15% { opacity: 1; transform: none; } 70% { opacity: 1; } 100% { opacity: 0; transform: translateY(-3px); } }

  /* ---------- World ---------- */
  .world { position: relative; overflow: hidden; background: #cfe0e2; }
  canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }

  .era { position: absolute; left: 16px; top: 14px; z-index: 2; pointer-events: none; padding: 6px 12px 7px; background: var(--paper-2); border: 1px solid var(--ink); box-shadow: 3px 3px 0 rgba(42,32,23,.18); }

  .hurry { position: absolute; right: 16px; top: 16px; z-index: 2; font-size: .85rem; font-style: italic; color: rgba(42,32,23,.6); pointer-events: none; }

  /* trail map */
  .trail { position: absolute; left: 0; right: 0; bottom: 0; z-index: 2; height: 54px; pointer-events: none; background: linear-gradient(to top, rgba(248,242,226,.95), rgba(248,242,226,.82)); border-top: 1px solid var(--rule); }
  .trail-inner { position: absolute; left: 28px; right: 28px; top: 8px; bottom: 6px; }
  .trail .path { position: absolute; left: 0; right: 0; top: 22px; border-top: 2px dashed var(--ink-3); }
  .trail .done { position: absolute; left: 0; top: 21px; height: 0; border-top: 4px solid var(--red); width: 0; }
  .trail .era-tick { position: absolute; top: 0; transform: translateX(-50%); font-size: .72rem; color: var(--ink-2); font-variant-caps: all-small-caps; letter-spacing: .08em; white-space: nowrap; }
  .trail .era-tick::after { content: ""; position: absolute; left: 50%; top: 15px; height: 14px; border-left: 1px solid var(--ink-3); }
  .trail .era-tick.now { color: var(--ink); font-weight: 700; }
  .trail .stop { position: absolute; top: 18px; width: 9px; height: 9px; margin-left: -4.5px; background: var(--paper-2); border: 1.5px solid var(--ink); transform: rotate(45deg); }
  .trail .stop.past { background: var(--red); border-color: var(--red); }
  .trail .you { position: absolute; top: 13px; width: 18px; height: 18px; margin-left: -9px; border-radius: 50%; background: var(--ink); border: 3px solid var(--paper-2); box-shadow: 0 0 0 1px var(--ink); }

  /* arrival notice */
  .notice { position: absolute; left: 50%; top: 14px; z-index: 3; transform: translateX(-50%); min-width: 280px; text-align: center; padding: 8px 26px 10px;
    background: var(--paper-2); border: 1px solid var(--ink); outline: 1px solid var(--ink); outline-offset: -5px; pointer-events: none;
    animation: noticeIn .55s var(--ease); transition: opacity .5s, transform .5s; }
  @keyframes noticeIn { from { opacity: 0; transform: translate(-50%, -14px); } }
  .notice.out { opacity: 0; transform: translate(-50%, -8px); }
  .notice small { display: block; font-size: .8rem; color: var(--ink-2); font-style: italic; }
  .notice .big { display: block; font-size: 2.3rem; line-height: 1.05; color: var(--red); font-variant-numeric: lining-nums; }
  .notice b { display: block; font-size: .95rem; font-variant-caps: all-small-caps; letter-spacing: .12em; }
  .notice em { display: block; margin-top: 3px; font-size: .82rem; color: var(--ink-2); }
  .touchgo { display: none; position: absolute; right: 14px; bottom: 66px; z-index: 3; width: 62px; height: 62px; border: 1px solid var(--ink); border-radius: 50%; background: var(--paper-2); color: var(--ink); font-size: 1.2rem; touch-action: none; user-select: none; -webkit-user-select: none; }
  .touchgo.on { display: block; }

  /* ---------- Landmark card ---------- */
  .card { position: absolute; z-index: 5; right: 22px; top: 50%; width: min(540px, 48%); max-height: calc(100% - 90px); overflow-y: auto;
    transform: translateY(calc(-50% - 22px)); background: var(--paper-2); border: 1px solid var(--ink); outline: 1px solid var(--ink); outline-offset: -6px;
    box-shadow: 6px 6px 0 rgba(42,32,23,.2); padding: 18px 22px 16px; animation: unfold .38s var(--ease); }
  @keyframes unfold { from { clip-path: inset(0 0 100% 0); } to { clip-path: inset(0 0 0 0); } }
  .card.out { animation: fold .25s var(--ease) forwards; }
  @keyframes fold { to { clip-path: inset(0 0 100% 0); } }
  .card > * { animation: lineIn .35s var(--ease) both; }
  .card > *:nth-child(2) { animation-delay: .05s; } .card > *:nth-child(3) { animation-delay: .1s; } .card > *:nth-child(4) { animation-delay: .15s; }
  .card > *:nth-child(5) { animation-delay: .2s; } .card > *:nth-child(6) { animation-delay: .25s; } .card > *:nth-child(n+7) { animation-delay: .3s; }
  @keyframes lineIn { from { opacity: 0; transform: translateY(5px); } }
  .meta-top { display: flex; justify-content: space-between; gap: 10px; font-size: .8rem; color: var(--ink-3); font-variant-caps: all-small-caps; letter-spacing: .1em; }
  .meta-top b { color: var(--red); font-weight: 700; }
  .arrive { margin: 2px 0 0; font-size: 1.32rem; font-weight: 700; line-height: 1.2; }
  .rule2 { height: 0; border-top: 3px double var(--ink); margin: 9px 0 10px; }
  .q-text { margin: 0; font-size: 1.04rem; line-height: 1.45; }
  .contrast { margin: 8px 0 0; font-size: .9rem; font-variant-caps: all-small-caps; letter-spacing: .1em; color: var(--ink-2); }
  .contrast b { color: var(--ink); } .contrast i { font-variant-caps: normal; letter-spacing: 0; color: var(--ink-3); padding: 0 4px; }
  .q-ask { margin: 10px 0 8px; font-style: italic; font-weight: 700; font-size: 1.06rem; }
  .choices { list-style: none; margin: 0; padding: 0; border-top: 1px solid var(--rule); }
  .answer { display: grid; grid-template-columns: 22px 26px 1fr; align-items: baseline; width: 100%; padding: 8px 6px; text-align: left; cursor: pointer;
    background: none; border: none; border-bottom: 1px solid var(--rule); font-size: 1.02rem; line-height: 1.3; transition: background .15s; }
  .answer .mark { color: var(--red); opacity: 0; transition: opacity .15s, transform .15s; transform: translateX(-4px); }
  .answer .n { font-weight: 700; font-variant-numeric: lining-nums; }
  .answer:hover, .answer.sel { background: var(--paper-3); }
  .answer.sel .mark, .answer:hover .mark { opacity: 1; transform: none; }
  .answer:focus-visible { outline: 2px solid var(--red); outline-offset: -2px; }
  .prompt { margin: 10px 0 0; font-size: .98rem; }
  .prompt .cur { display: inline-block; min-width: 1ch; font-weight: 700; color: var(--red); border-bottom: 2px solid var(--red); animation: blink 1s steps(2) infinite; font-variant-numeric: lining-nums; }
  .foot { margin-top: 12px; padding-top: 8px; border-top: 1px solid var(--rule); font-size: .8rem; line-height: 1.4; color: var(--ink-2); display: grid; gap: 5px; }
  .foot .lab { font-variant-caps: all-small-caps; letter-spacing: .1em; color: var(--red); font-weight: 700; margin-right: 4px; }
  .foot q { font-style: italic; quotes: "\201C" "\201D"; }
  .foot a { color: var(--red); font-variant-caps: all-small-caps; letter-spacing: .08em; font-weight: 700; text-decoration: underline; text-underline-offset: 2px; white-space: nowrap; }
  .defn { margin: 0 0 8px; padding: 6px 10px; border-left: 3px solid var(--gold); background: var(--paper-3); font-size: .9rem; }
  .defn b { font-variant-caps: all-small-caps; letter-spacing: .1em; }

  /* consequence */
  .result { padding: 4px 2px; }
  .result .lab { font-size: .8rem; color: var(--ink-3); font-variant-caps: all-small-caps; letter-spacing: .12em; }
  .result .picked { margin: 2px 0 6px; font-weight: 700; font-size: 1.05rem; }
  .result p { margin: 0 0 8px; font-style: italic; font-size: 1.08rem; line-height: 1.4; }
  .ledger-rows { border-top: 1px solid var(--ink); }
  .lrow { display: flex; align-items: baseline; gap: 8px; padding: 4px 0; border-bottom: 1px dotted var(--ink-3); font-size: .98rem; animation: lineIn .3s var(--ease) both; }
  .lrow:nth-child(2) { animation-delay: .08s; } .lrow:nth-child(3) { animation-delay: .16s; } .lrow:nth-child(4) { animation-delay: .24s; }
  .lrow span { flex: 1; font-variant-caps: all-small-caps; letter-spacing: .1em; }
  .lrow b { font-variant-numeric: lining-nums tabular-nums; }
  .lrow.up b { color: var(--green); } .lrow.down b { color: var(--red); }
  .timer { height: 2px; margin-top: 10px; background: var(--paper-3); overflow: hidden; }
  .timer i { display: block; height: 100%; background: var(--ink); transform-origin: left; animation: drain linear forwards; }
  @keyframes drain { to { transform: scaleX(0); } }

  /* ---------- Full screen pages ---------- */
  .screen { position: absolute; inset: 0; z-index: 20; overflow-y: auto; display: flex; justify-content: center; align-items: flex-start; padding: 22px 14px 30px;
    background: rgba(42,32,23,.42); }
  .page { width: min(720px, 100%); margin: auto 0; background: var(--paper-2); border: 1px solid var(--ink); outline: 1px solid var(--ink); outline-offset: -7px;
    box-shadow: 8px 8px 0 rgba(42,32,23,.25); padding: 22px 30px 22px; display: flex; flex-direction: column; gap: 11px; animation: pageIn .45s var(--ease); }
  @keyframes pageIn { from { opacity: 0; transform: translateY(14px); } }
  .page h1 { margin: 0; text-align: center; font-size: clamp(1.8rem, 5vw, 2.6rem); font-weight: 700; letter-spacing: .02em; line-height: 1.1; }
  .page .sub { margin: -6px 0 0; text-align: center; font-style: italic; color: var(--ink-2); }
  .orn { text-align: center; color: var(--ink-3); letter-spacing: .5em; margin: -4px 0; }
  .definition { margin: 0; padding: 10px 16px; text-align: center; border-top: 1px solid var(--ink); border-bottom: 1px solid var(--ink); }
  .definition .dl { font-size: .82rem; font-variant-caps: all-small-caps; letter-spacing: .14em; color: var(--red); font-weight: 700; }
  .definition .dt { font-style: italic; font-size: 1.1rem; line-height: 1.4; }
  .ask { margin: 0; font-weight: 700; font-size: 1.05rem; }
  .name-input { display: block; width: 100%; max-width: 340px; padding: 6px 2px; font-size: 1.1rem; background: transparent; border: none; border-bottom: 2px solid var(--ink); }
  .name-input:focus { outline: none; border-bottom-color: var(--red); }
  .name-input::placeholder { color: var(--ink-3); font-style: italic; }
  .occ { list-style: none; margin: 0; padding: 0; border-top: 1px solid var(--rule); }
  .char { display: grid; grid-template-columns: 22px 54px 1fr; gap: 12px; align-items: center; width: 100%; padding: 7px 6px; text-align: left; cursor: pointer;
    background: none; border: none; border-bottom: 1px solid var(--rule); transition: background .15s; }
  .char:hover, .char.sel { background: var(--paper-3); }
  .char .mark { color: var(--red); font-weight: 700; font-variant-numeric: lining-nums; }
  .char .pic { width: 54px; height: 54px; border: 1px solid var(--ink); }
  .char .pic svg { display: block; width: 100%; height: 100%; }
  .char .cn { font-weight: 700; font-variant-caps: all-small-caps; letter-spacing: .12em; font-size: 1.08rem; }
  .char .cl { font-size: .95rem; }
  .char .cs { font-size: .82rem; color: var(--ink-2); font-style: italic; }
  .char:focus-visible { outline: 2px solid var(--red); outline-offset: -2px; }
  .controls { margin: 0; text-align: center; font-size: .86rem; color: var(--ink-2); font-style: italic; }
  .primary { display: block; width: 100%; min-height: 54px; cursor: pointer; background: var(--ink); color: var(--paper-2); border: 1px solid var(--ink);
    font-size: 1.1rem; font-weight: 700; font-variant-caps: all-small-caps; letter-spacing: .16em; transition: background .15s, transform .1s; }
  .primary:hover:not(:disabled) { background: var(--red-2); }
  .primary:active:not(:disabled) { transform: translateY(1px); }
  .primary:disabled { background: transparent; color: var(--ink-3); border-style: dashed; cursor: not-allowed; }
  .primary:focus-visible { outline: 2px solid var(--red); outline-offset: 3px; }

  /* ending */
  .score-row { display: grid; grid-template-columns: auto 1fr; gap: 26px; align-items: center; }
  .scorebox { text-align: center; padding: 6px 18px; border-right: 1px solid var(--rule); }
  .scorebox .lab { font-size: .8rem; font-variant-caps: all-small-caps; letter-spacing: .14em; color: var(--ink-2); }
  .scorebox b { display: block; font-size: 4.2rem; line-height: 1; color: var(--red); font-variant-numeric: lining-nums; }
  .scorebox small { font-style: italic; color: var(--ink-2); }
  .finals { border-top: 1px solid var(--ink); }
  .frow { display: grid; grid-template-columns: 1fr 44px 120px; gap: 10px; align-items: center; padding: 5px 0; border-bottom: 1px dotted var(--ink-3); }
  .frow span { font-variant-caps: all-small-caps; letter-spacing: .1em; }
  .frow b { text-align: right; font-variant-numeric: lining-nums tabular-nums; }
  .frow .r-bar { margin: 0; }
  .persona { border: 1px solid var(--ink); padding: 16px 18px; display: grid; gap: 10px; background: var(--paper); }
  .persona-head { display: flex; align-items: center; gap: 14px; }
  .badge { width: 64px; height: 64px; flex: none; border: 2px solid var(--ink); border-radius: 50%; display: grid; place-items: center; background: var(--paper-2); }
  .badge svg { width: 40px; height: 40px; }
  .persona-label { font-size: .8rem; font-variant-caps: all-small-caps; letter-spacing: .14em; color: var(--red); font-weight: 700; }
  .persona-name { font-weight: 700; font-size: clamp(1.4rem, 4vw, 1.9rem); line-height: 1.1; }
  .persona-tag { font-style: italic; color: var(--ink-2); }
  .persona-text { margin: 0; font-size: 1.02rem; line-height: 1.45; }
  .traits { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; }
  .trait-top { display: flex; justify-content: space-between; font-size: .82rem; font-variant-caps: all-small-caps; letter-spacing: .1em; }
  .trait-bar { position: relative; height: 7px; margin-top: 3px; border: 1px solid var(--ink); background: var(--paper-2); }
  .trait-bar i { display: block; height: 100%; }
  .trait.duty i { background: var(--gold); } .trait.balance i { background: var(--blue); } .trait.self i { background: var(--red); }
  .persona-facts { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; font-size: .88rem; line-height: 1.4; }
  .persona-facts div { border-top: 1px solid var(--rule); padding-top: 6px; }
  .persona-facts b { display: block; font-size: .78rem; font-variant-caps: all-small-caps; letter-spacing: .12em; color: var(--red); }
  .persona-basis { margin: 0; font-size: .82rem; font-style: italic; color: var(--ink-2); }
  .pattern { margin: 0; font-size: 1.03rem; line-height: 1.5; padding-left: 14px; border-left: 3px solid var(--red); }
  .conclusion { margin: 0; font-size: 1rem; line-height: 1.5; }
  .section-label { margin: 6px 0 -4px; font-size: .86rem; font-variant-caps: all-small-caps; letter-spacing: .14em; color: var(--red); font-weight: 700; border-bottom: 1px solid var(--rule); padding-bottom: 3px; }
  .actions { margin: 0; padding-left: 22px; display: grid; gap: 6px; }
  .actions li { line-height: 1.4; }
  .path { list-style: none; margin: 0; padding: 0; columns: 2; column-gap: 24px; font-size: .88rem; }
  .path li { break-inside: avoid; padding: 3px 0; border-bottom: 1px dotted var(--ink-3); }
  .path li::before { content: "\25C6"; font-size: .6rem; margin-right: 6px; vertical-align: 2px; color: var(--ink-3); }
  .path li.duty::before { color: var(--gold); } .path li.self::before { color: var(--red); } .path li.balance::before { color: var(--blue); }
  .note { margin: 0; font-size: .85rem; color: var(--ink-2); text-align: center; font-style: italic; }
  .sources { border-top: 1px solid var(--rule); padding-top: 8px; }
  .sources summary { cursor: pointer; font-variant-caps: all-small-caps; letter-spacing: .14em; color: var(--red); font-weight: 700; }
  .sources h2 { font-size: 1rem; margin: 10px 0 6px; }
  .sources ul { list-style: none; margin: 0; padding: 0; }
  .sources li { font-size: .88rem; line-height: 1.45; padding-left: 2em; text-indent: -2em; margin-bottom: 7px; }
  .sources a { color: var(--red); font-variant-caps: all-small-caps; letter-spacing: .08em; font-weight: 700; white-space: nowrap; }

  /* game over */
  .stone { display: block; width: 190px; height: auto; margin: 0 auto -4px; }
  .over-label { text-align: center; font-size: .86rem; font-variant-caps: all-small-caps; letter-spacing: .18em; color: var(--red); font-weight: 700; }
  .over-text { margin: 0; text-align: center; font-size: 1.08rem; line-height: 1.45; }
  .over-facts { margin: 0; text-align: center; font-size: .9rem; color: var(--ink-2); line-height: 1.5; font-style: italic; }
  .over-lesson { margin: 0; padding-left: 14px; border-left: 3px solid var(--red); }

  @media (max-width: 860px) {
    .ledger { grid-template-columns: 1fr 1fr; }
    .ledger > .supplies-wrap { grid-column: 1 / -1; border-left: none; border-top: 1px solid var(--rule); }
    .ledger > div { padding: 6px 12px; }
    .supplies { gap: 10px; }
    .r-name { font-size: .78rem; } .r-name .long { display: none; } .r-name .short { display: inline; }
    .supplies-wrap { padding-bottom: 8px !important; }
    .card { left: 10px; right: 10px; top: auto; bottom: 60px; transform: none; width: auto; max-height: calc(100% - 76px); padding: 14px 16px 12px; }
    .era b { font-size: 1.2rem; }
    .hurry { display: none; }
    .trail .era-tick { font-size: .6rem; }
    .score-row { grid-template-columns: 1fr; gap: 12px; }
    .scorebox { border-right: none; border-bottom: 1px solid var(--rule); padding-bottom: 10px; }
    .persona-facts, .traits { grid-template-columns: 1fr; gap: 8px; }
    .path { columns: 1; }
    .page { padding: 20px 18px; }
    .notice { min-width: 0; padding: 6px 16px 8px; } .notice .big { font-size: 1.7rem; }

<script>
(function () {
  "use strict";
  const UI = GAME.ui;
  const RES = ["time", "money", "trust", "duty"];
  const ENC = GAME.encounters;
  const SPACING = TUNING.spacing, FIRST = TUNING.firstAt;
  const encX = i => FIRST + i * SPACING;
  const END_X = encX(ENC.length - 1) + 650;
  /* World x where each section starts (section 5 is TODAY). */
  const SECTION_START = [0, encX(1) - 400, encX(2) - 400, encX(4) - 400, encX(6) - 400, encX(9) - 380];
  const GROUND = 470; /* design units, screen is 600 units tall */

  /* ================= State ================= */
  const canvas = document.getElementById("canvas");

  const worldEl = document.getElementById("world");
  const layer = document.getElementById("layer");
  let S, viewW = 0, viewH = 0, dpr = 1, k = 1;
  let hurrying = false;
  function fresh() {

      x: 0, next: 0, picks: [], jury: null, section: 0, shiftAt: -1e9, mul: 1, dustAcc: 0, walk: 0, cardAt: 0, sel: 0, locked: false };
  }

  /* ================= Helpers ================= */
  const $ = id => document.getElementById(id);
  function h(tag, cls, html) { const n = document.createElement(tag); if (cls) n.className = cls; if (html != null) n.innerHTML = html; return n; }
  function clamp(v, a, b) { return Math.max(a, Math.min(b, v)); }
  function fxText(key, d) { return UI.resourcesShort[key] + " " + (d > 0 ? "+" : "−") + Math.abs(d); }
  function sectionAt(x) { let s = 0; for (let i = 0; i < SECTION_START.length; i++) if (x >= SECTION_START[i]) s = i; return s; }

  /* ================= Portraits ================= */
  const N = "#1c2a44", E = "#e8d9b6", R = "#b5402c", BR = "#8a6a44";
  const PORTRAIT = {
    farmer: '<svg viewBox="0 0 80 80"><rect width="80" height="80" fill="' + E + '"/><path d="M16 80c0-15 10-24 24-24s24 9 24 24z" fill="#5f7a52"/><circle cx="40" cy="41" r="12" fill="#f0d0a8"/><ellipse cx="40" cy="31" rx="21" ry="4.5" fill="#d6ad5c"/><path d="M30 31c0-9 4-13 10-13s10 4 10 13z" fill="#d6ad5c"/><path d="M67 34v46M61 24v10h12V24M67 24v10" fill="none" stroke="' + N + '" stroke-width="3" stroke-linecap="round"/></svg>',
    shopkeeper: '<svg viewBox="0 0 80 80"><rect width="80" height="80" fill="' + E + '"/><path d="M16 80c0-15 10-24 24-24s24 9 24 24z" fill="#3c4a68"/><path d="M31 60h18v20H31z" fill="#fbf6ea"/><circle cx="40" cy="41" r="12" fill="#f0d0a8"/><circle cx="35.5" cy="42" r="3" fill="none" stroke="' + N + '" stroke-width="1.5"/><circle cx="44.5" cy="42" r="3" fill="none" stroke="' + N + '" stroke-width="1.5"/><path d="M21 33L40 20l19 13q-19 -5 -38 0z" fill="' + N + '"/></svg>',
    apprentice: '<svg viewBox="0 0 80 80"><rect width="80" height="80" fill="' + E + '"/><path d="M16 80c0-15 10-24 24-24s24 9 24 24z" fill="' + R + '"/><circle cx="40" cy="42" r="12" fill="#f0d0a8"/><path d="M27 36c0-11 6-16 14-16 8 0 14 4 15 12-5 0-8 1-10 4z" fill="' + N + '"/><path d="M63 46l9 32" stroke="' + BR + '" stroke-width="4" stroke-linecap="round"/><rect x="55" y="39" width="16" height="8" rx="2" transform="rotate(-16 63 43)" fill="' + N + '"/></svg>'
  };

  /* ================= Palettes per section ================= */
  const PAL = [
    { skyA: "#bfe0ec", skyB: "#f6ecd4", hill: "#b9cc8f", hill2: "#a6bd7c", ground: "#9dbb66", road: "#dcc493", edge: "#c6ab76" },
    { skyA: "#c6e2ea", skyB: "#f5ead2", hill: "#b4c78e", hill2: "#9fb77b", ground: "#98b666", road: "#d5bd8e", edge: "#bfa274" },
    { skyA: "#f1cfa0", skyB: "#f8ead0", hill: "#c9b98a", hill2: "#b5a778", ground: "#a3b468", road: "#d2b88a", edge: "#b99c6d" },
    { skyA: "#cbdce7", skyB: "#f3ead8", hill: "#b1c2a0", hill2: "#9db08d", ground: "#96b16c", road: "#c79a7a", edge: "#a97c5f" },
    { skyA: "#c3d3e2", skyB: "#efe7d6", hill: "#a9b9a6", hill2: "#96a894", ground: "#92ad6e", road: "#bd9377", edge: "#9d765d" },
    { skyA: "#8cc9ef", skyB: "#e4f3fb", hill: "#a8cfa8", hill2: "#8fbf93", ground: "#86c06d", road: "#5d636b", edge: "#d9d9d4" }
  ];
  function mix(a, b, t) {
    const pa = parseInt(a.slice(1), 16), pb = parseInt(b.slice(1), 16);
    const r = Math.round(((pa >> 16) & 255) * (1 - t) + ((pb >> 16) & 255) * t);

  }
  function paletteAt(x) {
    const s = sectionAt(x);

    const A = PAL[s], B2 = PAL[Math.min(s + 1, PAL.length - 1)];

  }

  /* ================= Scenery (generated once) ================= */
  const DECOR = [];
  (function buildDecor() {
    let seed = 11; const rnd = () => (seed = (seed * 9301 + 49297) % 233280) / 233280;
    const busy = x => ENC.some((e, i) => Math.abs(encX(i) - x) < 260) || SECTION_START.some((g, i) => i > 0 && Math.abs(g - x) < 140);
    for (let x = -200; x < END_X + 1400; x += 110 + rnd() * 120) {
      if (busy(x)) continue;
      const s = sectionAt(x), r = rnd();
      let type;
      if (s === 0) type = r < .45 ? "tree" : r < .7 ? "fence" : r < .85 ? "hay" : "cow";
      else if (s === 5) type = r < .35 ? "tower" : r < .55 ? "tree" : r < .75 ? "lamp" : r < .9 ? "person" : "car";
      else if (s >= 3) type = r < .4 ? "row" : r < .6 ? "tree" : r < .8 ? "person" : "lampOld";
      else type = r < .4 ? "house" : r < .65 ? "tree" : r < .85 ? "person" : "fence";

  })();

  /* ================= Drawing primitives ================= */
  function rr(x, y, w, hh, r) { ctx.beginPath(); ctx.moveTo(x + r, y); ctx.arcTo(x + w, y, x + w, y + hh, r); ctx.arcTo(x + w, y + hh, x, y + hh, r); ctx.arcTo(x, y + hh, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath(); }
  function box(x, y, w, hh, c) { ctx.fillStyle = c; ctx.fillRect(x, y, w, hh); }
  function circ(x, y, r, c) { ctx.fillStyle = c; ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2); ctx.fill(); }
  function poly(pts, c) { ctx.fillStyle = c; ctx.beginPath(); pts.forEach((p, i) => i ? ctx.lineTo(p[0], p[1]) : ctx.moveTo(p[0], p[1])); ctx.closePath(); ctx.fill(); }
  function softShadow(x, w) { ctx.fillStyle = "rgba(40,50,30,.16)"; ctx.beginPath(); ctx.ellipse(x, GROUND + 4, w / 2, 7, 0, 0, Math.PI * 2); ctx.fill(); }
  function label(x, y, text) {
    ctx.font = "800 13px system-ui, -apple-system, Segoe UI, sans-serif";
    const w = ctx.measureText(text).width + 22;
    ctx.fillStyle = "rgba(28,42,68,.9)"; rr(x - w / 2, y - 13, w, 26, 13); ctx.fill();
    ctx.fillStyle = "#fbf6ea"; ctx.textAlign = "center"; ctx.textBaseline = "middle"; ctx.fillText(text, x, y + 1);
  }

  /* Who walks the street in each section: [style A, style B] */
  const PEOPLE = [["colonial", "woman"], ["colonial", "woman"], ["continental", "woman"], ["gentleman", "lady"], ["gentleman", "lady"], ["modern", "modern2"]];
  /* people: style = colonial | woman | militia | crier | continental | gentleman | lady | modern | modern2 */
  function person(x, style, t, flip) {
    const bob = Math.sin(t / 380 + x) * 1.2;
    const y = GROUND;
    const coat = { colonial: "#46597a", woman: "#8a4f6a", militia: "#6b5a3e", modern: "#3f7fb5", modern2: "#d0633f", crier: "#7a2e22", continental: "#2e4a7d", gentleman: "#2f3a2f", lady: "#5f79a8" }[style] || "#46597a";
    const period = style === "continental" || style === "gentleman";
    ctx.save(); ctx.translate(x, 0); if (flip) ctx.scale(-1, 1);
    softShadow(0, 28);
    if (style === "woman" || style === "lady") poly([[style === "lady" ? -16 : -12, y], [style === "lady" ? 16 : 12, y], [7, y - 42], [-7, y - 42]], coat);
    else if (period) { box(-7, y - 26, 5, 12, style === "continental" ? "#d9c49a" : "#2b2b2b"); box(2, y - 26, 5, 12, style === "continental" ? "#d9c49a" : "#2b2b2b"); box(-7, y - 14, 5, 14, "#f1ece0"); box(2, y - 14, 5, 14, "#f1ece0"); }
    else { box(-7, y - 26, 5, 26, style.startsWith("modern") ? "#2f3d57" : "#3b3024"); box(2, y - 26, 5, 26, style.startsWith("modern") ? "#2f3d57" : "#3b3024"); }
    if (style === "gentleman") poly([[-10, y - 30 + bob], [-14, y - 12], [-2, y - 22 + bob]], coat);
    rr(-10, y - 50 + bob, 20, 28, 7); ctx.fillStyle = coat; ctx.fill();
    if (style === "continental") box(-2, y - 49 + bob, 4, 26, "#e8d7a8");
    if (style === "gentleman" || style === "lady") poly([[-4, y - 50 + bob], [4, y - 50 + bob], [0, y - 43 + bob]], "#fbf6ea");
    circ(0, y - 59 + bob, 9, "#f0d0a8");
    if (style === "colonial" || style === "crier" || style === "militia" || style === "continental" || style === "gentleman") poly([[-13, y - 63 + bob], [0, y - 74 + bob], [13, y - 63 + bob]], "#1c2a44");
    else if (style === "woman") { circ(0, y - 63 + bob, 10, "#f4ecdc"); }
    else if (style === "lady") { circ(0, y - 64 + bob, 9, "#8a6a44"); circ(-7, y - 60 + bob, 5, "#8a6a44"); }
    else circ(0, y - 64 + bob, 8, style === "modern" ? "#3b2a1c" : "#1c1c1c");
    if (style === "militia") { ctx.strokeStyle = "#5a3d2a"; ctx.lineWidth = 3; ctx.beginPath(); ctx.moveTo(8, y - 30); ctx.lineTo(14, y - 78); ctx.stroke(); }
    ctx.restore();
  }
  function tree(x, v, modern) {
    const hgt = 110 + v * 50;
    softShadow(x, 50);
    box(x - 5, GROUND - hgt * .45, 10, hgt * .45, "#7a5a3a");
    const sw = Math.sin(NOW / 1100 + x * .013) * 2.2;
    circ(x + sw, GROUND - hgt * .62, 30 + v * 10, modern ? "#4f9a5a" : "#6d9449");
    circ(x - 20 + sw * .8, GROUND - hgt * .5, 22 + v * 6, modern ? "#5aa865" : "#7ba355");
    circ(x + 18 + sw * 1.2, GROUND - hgt * .72, 22 + v * 6, modern ? "#63b06d" : "#86ad5e");
  }
  function colonialHouse(x, v, brick) {
    const w = 110 + v * 40, hh = 80 + v * 20, c = brick ? "#b86b4f" : ["#e7dcc4", "#dfe6ea", "#e9d6b8"][Math.floor(v * 3)];

  }
  function rowHouses(x, v) {
    for (let i = 0; i < 3; i++) {

  function tower(x, v) {

    for (let yy = GROUND - hh + 14; yy < GROUND - 30; yy += 22) for (let xx = x - w / 2 + 10; xx < x + w / 2 - 14; xx += 20) ctx.fillRect(xx, yy, 12, 12);

  }

  /* ================= Encounter objects ================= */
  function drawEncounter(i, x, t) {
    const G = GROUND;
    switch (i) {
      case 0: { /* farm with a farmer */
        for (let r = 0; r < 5; r++) box(x - 190, G - 6 - r * 7, 170, 4, r % 2 ? "#8c7a42" : "#a08c4c");
        softShadow(x + 80, 160); box(x + 10, G - 110, 140, 110, "#b5402c");
        poly([[x, G - 110], [x + 80, G - 165], [x + 160, G - 110]], "#7a2e22");

        ctx.strokeStyle = "#f5ecd6"; ctx.lineWidth = 3; ctx.beginPath(); ctx.moveTo(x + 64, G - 56); ctx.lineTo(x + 96, G); ctx.moveTo(x + 96, G - 56); ctx.lineTo(x + 64, G); ctx.stroke();

      }

      }

        poly([[x - 105, G - 150], [x, G - 200], [x + 105, G - 150]], "#5b6679");
        box(x - 60, G - 120, 120, 30, "#1c2a44");
        ctx.fillStyle = "#fbf6ea"; ctx.font = "800 14px system-ui, sans-serif"; ctx.textAlign = "center"; ctx.textBaseline = "middle"; ctx.fillText("PRINTER", x, G - 104);

        /* press out front */

      }

        rr(x - 70, G - 210, 140, 160, 6); ctx.fillStyle = "#f6ecd2"; ctx.fill();

      case 4: { /* Constitutional Convention hall */

        box(x - 36, G - 240, 72, 100, "#b86b4f"); box(x - 30, G - 300, 60, 60, "#f3efe4");
        poly([[x - 22, G - 300], [x, G - 360], [x + 22, G - 300]], "#f3efe4");
        circ(x, G - 270, 14, "#fbf6ea"); ctx.strokeStyle = N; ctx.lineWidth = 2; ctx.beginPath(); ctx.moveTo(x, G - 270); ctx.lineTo(x, G - 279); ctx.moveTo(x, G - 270); ctx.lineTo(x + 7, G - 270); ctx.stroke();

      case 5: { /* town meeting */

        box(x - 16, G - 230, 32, 60, "#f3efe4"); poly([[x - 18, G - 230], [x, G - 268], [x + 18, G - 230]], "#6b7280");

        [[-135, G - 110], [145, G - 110]].forEach(([dx, yy]) => { rr(x + dx - 14, yy - 16, 28, 22, 8); ctx.fillStyle = "#fff"; ctx.fill(); ctx.fillStyle = R; ctx.font = "800 15px system-ui"; ctx.textAlign = "center"; ctx.fillText("!", x + dx, yy - 4); });
        return G - 290;
      }
      case 6: { /* newspaper board */
        box(x - 80, G - 18, 8, 18, "#5a3d2a"); box(x + 72, G - 18, 8, 18, "#5a3d2a");
        rr(x - 90, G - 210, 180, 194, 6); ctx.fillStyle = "#f6f1e3"; ctx.fill();
        ctx.fillStyle = N; ctx.font = "700 17px Georgia, serif"; ctx.textAlign = "center"; ctx.textBaseline = "middle";
        ctx.fillText("THE FEDERALIST.", x, G - 186); ctx.font = "italic 13px Georgia, serif"; ctx.fillText("No. LI.", x, G - 166);
        box(x - 76, G - 156, 152, 2, N);
        ctx.fillStyle = "rgba(28,42,68,.4)"; for (let c2 = 0; c2 < 2; c2++) for (let j = 0; j < 9; j++) ctx.fillRect(x - 72 + c2 * 76, G - 146 + j * 13, 66 - (j % 4) * 6, 3);
        person(x + 130, "colonial", t, true);
        return G - 235;
      }
      case 7: { /* first federal election stage */
        box(x - 110, G - 40, 220, 40, "#8a6a44");
        for (let j = 0; j < 5; j++) poly([[x - 110 + j * 44, G - 40], [x - 66 + j * 44, G - 40], [x - 88 + j * 44, G - 16]], j % 2 ? "#fbf6ea" : "#b5402c");
        box(x - 20, G - 92, 40, 52, "#6b4a38");
        person(x, "colonial", t);
        [[-160, "colonial"], [-130, "woman"], [150, "colonial"]].forEach(([dx, s], j) => person(x + dx, s, t + j * 70, dx > 0));
        box(x + 170, G - 150, 5, 150, "#5a3d2a");
        poly([[x + 175, G - 148], [x + 225, G - 140 + Math.sin(t / 300) * 3], [x + 175, G - 118]], "#1c2a44");
        return G - 180;

    const num = sb.querySelector("[data-score]"), t0 = performance.now();
    (function tick(now) { const p = clamp((now - t0) / 1000, 0, 1); num.textContent = Math.round(total * (1 - Math.pow(1 - p, 3))); if (p < 1) requestAnimationFrame(tick); })(t0);
  }
  function esc(s) { return String(s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c])); }
  function gameOver(key, i, c) {
    S.mode = "over"; hurrying = false;
    const G = GAME.gameOver, why = G.reasons[key], d = ENC[i];
    const scr = h("div", "screen"), page = h("div", "page");
    page.appendChild(h("div", "over-label", G.label));
    const nm = S.name, fit = nm.length > 11 ? ' textLength="104" lengthAdjust="spacingAndGlyphs"' : "";
    page.appendChild(h("div", null,
      '<svg class="stone" viewBox="0 0 200 172" aria-hidden="true"><path d="M44 160V74a56 56 0 0 1 112 0v86z" fill="#d8d0bd" stroke="#2a2017" stroke-width="2"/>' +
      '<path d="M52 160V78a48 48 0 0 1 96 0v82" fill="none" stroke="rgba(42,32,23,.2)" stroke-width="1.5"/>' +
      '<path d="M18 161h164" stroke="#2a2017" stroke-width="3"/><path d="M26 160c8-12 16-12 24 0M146 160c7-10 15-10 22 0M60 160c4-6 8-6 12 0" stroke="#4c6a38" stroke-width="3" fill="none"/>' +
      '<text x="100" y="74" text-anchor="middle" font-family="Georgia,serif" font-size="11" letter-spacing="2" fill="#2a2017">' + esc(UI.hereLies.toUpperCase()) + "</text>" +
      '<text x="100" y="98" text-anchor="middle" font-family="Georgia,serif" font-size="16" font-weight="700" fill="#2a2017"' + fit + ">" + esc(nm) + "</text>" +
      '<text x="100" y="122" text-anchor="middle" font-family="Georgia,serif" font-size="10.5" font-style="italic" fill="#2a2017">' + esc(why.epitaph) + "</text></svg>"));
    page.appendChild(h("h1", null, why.title));
    page.appendChild(h("p", "over-text", why.text));
    const facts = h("p", "over-facts");
    facts.textContent = G.reached.replace("{n}", S.next) + " " + G.endedAt.replace("{place}", d.place.split(" ").map(w => w === "OF" ? "of" : w[0] + w.slice(1).toLowerCase()).join(" ")).replace("{year}", d.year) + " " + G.lastChoice + " " + c.label + ".";
    page.appendChild(facts);
    page.appendChild(h("p", "over-lesson", why.lesson));
    const again = h("button", "primary", G.tryAgain); again.type = "button";
    again.addEventListener("click", reset);
    page.appendChild(again);
    scr.appendChild(page); layer.appendChild(scr);
    again.focus({ preventScroll: true });
  }
  function sourcesBlock() {
    const SRC = GAME.sources, d = h("details", "sources");
    d.appendChild(h("summary", null, UI.sourcesLabel.toLowerCase()));
    [[UI.citedLabel, SRC.cited], [UI.consultedLabel, SRC.consulted]].forEach(([lab, list]) => {
      d.appendChild(h("h2", null, lab));
      const ul = h("ul");
      list.forEach(s => { const li = h("li", null, s.text + " "); const a = h("a", null, SRC.linkText.toLowerCase()); a.href = s.url; a.target = "_blank"; a.rel = "noopener"; li.appendChild(a); ul.appendChild(li); });
      d.appendChild(ul);
    });
    return d;
  }

  /* ================= Boot ================= */
  function reset() {
    clearTimeout(resultTimer); hurrying = false; dust.length = 0;
    worldEl.classList.remove("dim");
    worldEl.querySelectorAll(".notice").forEach(n => n.remove());
    S = fresh(); S.mul = 1;
    updateHud();
    setEra(0, false);
    showStart();
  }
  buildHud();
  buildTimeline();
  resize();
  window.addEventListener("resize", resize);
  reset();
  requestAnimationFrame(frame);

  /* Read only view of the game state for automated testing. */
  window.__duty = { get state() { return S; }, encX, endX: END_X, tuning: TUNING,
    step(seconds) { for (let s = 0; s < seconds; s += 0.02) update(0.02); } };
})();
</script>
</body>
</html>
