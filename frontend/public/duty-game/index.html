<body>
<div class="app">
  <header class="hud">
    <div class="who">
      <div class="portrait" id="hudPortrait" aria-hidden="true"></div>
      <div style="min-width:0"><div class="brand" id="hudBrand"></div><div class="pname" id="hudName"></div></div>
    </div>
    <div class="tracker" id="tracker" aria-live="polite"><div class="tl" id="trackLabel"></div><div class="tv" id="trackVal"></div></div>
    <div class="res" id="res"></div>
  </header>
  <div class="world" id="world">
    <canvas id="canvas" aria-label="Your journey through American civic history"></canvas>
    <div class="era" id="era" aria-live="polite"></div>
    <div class="timeline" id="timeline" aria-hidden="true"></div>
    <div class="hurry" id="hurry"></div>
    <button class="touchgo" id="touchgo" aria-label="Hurry">&#9654;&#9654;</button>
    <div id="layer"></div>
  </div>
</div>

<script>
(function () {
  "use strict";
  const UI = GAME.ui;
  const RES = ["time", "money", "trust", "duty"];
  const ENC = GAME.encounters;
  const SPACING = TUNING.spacing, FIRST = TUNING.firstAt;
  const encX = i => FIRST + i * SPACING;
  const END_X = encX(ENC.length - 1) + 650;
  /* World x where each section starts (section 5 is TODAY). */
  const SECTION_START = [0, encX(1) - 400, encX(2) - 400, encX(4) - 400, encX(6) - 400, encX(9) - 380];
  const GROUND = 470; /* design units, screen is 600 units tall */

  /* ================= State ================= */
  const canvas = document.getElementById("canvas");
  const ctx = canvas.getContext("2d");
  const worldEl = document.getElementById("world");
  const layer = document.getElementById("layer");
  let S, viewW = 0, viewH = 0, dpr = 1, k = 1;
  let hurrying = false;
  function fresh() {
    return { mode: "start", char: null, name: UI.defaultName,
      res: { time: 50, money: 50, trust: GAME.startTrust, duty: GAME.startDuty },
      x: 0, next: 0, picks: [], jury: null, section: 0, shiftAt: -1e9, walk: 0, cardAt: 0, sel: 0, locked: false };
  }

  /* ================= Helpers ================= */
  const $ = id => document.getElementById(id);
  function h(tag, cls, html) { const n = document.createElement(tag); if (cls) n.className = cls; if (html != null) n.innerHTML = html; return n; }
  function clamp(v, a, b) { return Math.max(a, Math.min(b, v)); }
  function fxText(key, d) { return UI.resourcesShort[key] + " " + (d > 0 ? "+" : "−") + Math.abs(d); }
  function sectionAt(x) { let s = 0; for (let i = 0; i < SECTION_START.length; i++) if (x >= SECTION_START[i]) s = i; return s; }

    if (sec !== S.section) { S.section = sec; showBanner(sec); setEra(sec, true); S.shiftAt = performance.now(); }
    if (S.next < ENC.length && S.x >= encX(S.next) - TUNING.triggerAhead) {
      S.x = encX(S.next) - TUNING.triggerAhead;

  }
  function applyFx(fx) {
    RES.forEach(key => {
      const d = fx[key] || 0; if (!d) return;
      const from = S.res[key], to = clamp(from + d, 0, 100); S.res[key] = to;
      const r = document.querySelector('.hud .r[data-k="' + key + '"]');
      r.querySelector(".r-fill").style.width = to + "%";
      r.classList.remove("up", "down"); void r.offsetWidth; r.classList.add(d > 0 ? "up" : "down");
      setTimeout(() => r.classList.remove("up", "down"), 650);
      const f = h("span", "float " + (d > 0 ? "up" : "down"), (d > 0 ? "+" : "−") + Math.abs(d)); r.appendChild(f); setTimeout(() => f.remove(), 1200);
      const val = r.querySelector(".r-val"), t0 = performance.now();
      (function tick(now) {
        const p = clamp((now - t0) / 500, 0, 1);
        val.textContent = Math.round(from + (to - from) * (1 - Math.pow(1 - p, 3)));
        if (p < 1) requestAnimationFrame(tick); else paintRes(key, to);
      })(t0);
    });
  }
  function setTracker(bump) {
    $("trackVal").textContent = S.next + " / " + ENC.length;
    const tr = $("tracker"); if (bump) { tr.classList.remove("bump"); void tr.offsetWidth; tr.classList.add("bump"); }
  }
  function updateHud() {
    $("hudName").textContent = S.name;
    $("hudPortrait").innerHTML = S.char ? PORTRAIT[S.char] : "";
    RES.forEach(key => paintRes(key, S.res[key]));
    setTracker(false);
  }

  /* ================= Start screen ================= */
  function showStart() {
    layer.innerHTML = "";
    const scr = h("div", "screen"), panel = h("div", "panel");
    panel.appendChild(h("h1", null, UI.chooseTitle));
    const input = h("input", "name-input"); input.type = "text"; input.maxLength = 18; input.placeholder = UI.namePlaceholder; input.autocomplete = "off";
    input.setAttribute("aria-label", UI.namePlaceholder);
    input.addEventListener("input", () => { const v = input.value.trim(); S.name = v ? v.toUpperCase() : UI.defaultName; updateHud(); });
    input.addEventListener("keydown", e => { if (e.key === "Enter" && S.char) { e.preventDefault(); begin(); } });
    panel.appendChild(input);
    const chars = h("div", "chars"); chars.setAttribute("role", "radiogroup");
    const go = h("button", "primary", UI.pickPrompt); go.type = "button"; go.disabled = true;
    GAME.characters.forEach(c => {
      const b = h("button", "char"); b.type = "button"; b.setAttribute("role", "radio"); b.setAttribute("aria-checked", "false");
      b.innerHTML = '<div class="pic">' + PORTRAIT[c.id] + '</div><div class="char-body"><div class="cn">' + c.name + '</div><div class="cl">' + c.line +
        '</div><div class="perks">' + c.perks.map(p => '<span class="perk">' + p + "</span>").join("") + "</div></div>";
      b.addEventListener("click", () => {
        S.char = c.id; S.res.time = c.start.time; S.res.money = c.start.money;
        chars.querySelectorAll(".char").forEach(x => { x.classList.toggle("sel", x === b); x.setAttribute("aria-checked", x === b ? "true" : "false"); });
        updateHud(); go.disabled = false; go.textContent = UI.start;
      });
      chars.appendChild(b);
    });
    panel.appendChild(chars);
    panel.appendChild(h("div", "definition", '<div class="dl">' + GAME.definition.label + '</div><div class="dt">' + GAME.definition.text + "</div>"));
    const ctl = h("ul", "controls"); UI.controls.forEach(t => ctl.appendChild(h("li", null, t))); panel.appendChild(ctl);
    go.addEventListener("click", () => { if (S.char) begin(); });
    panel.appendChild(go);
    scr.appendChild(panel); layer.appendChild(scr);
  }
  function begin() {
    if (S.mode !== "start") return;
    layer.innerHTML = "";
    S.mode = "run"; S.startedAt = performance.now();
    showBanner(0);
  }

  /* ================= Ending ================= */
  function score() { return Math.round(clamp(S.res.duty * 0.65 + S.res.trust * 0.35, 0, 100)); }
  function counts(picks) { return picks.reduce((a, p) => (a[p.kind]++, a), { duty: 0, balance: 0, self: 0 }); }
  function personalityFor(picks) {
    const c = counts(picks), chose = (i, j) => picks.some(p => p.i === i && p.j === j);
    if (c.self >= 6) return "bystander";
    if (c.duty >= 8) return "minuteman";
    if (c.balance >= 5 && c.self <= 2) return "compromiser";
    if (chose(3, 0) && c.duty >= 5) return "reformer";
    if (chose(8, 1) && c.self <= 3) return "watchdog";
    if (c.balance >= 4 && c.self <= 2) return "compromiser";
    return "pragmatist";
  }
  const BADGE = {
    minuteman: '<path d="M14 40h36M18 40c0-10 6-16 14-16s14 6 14 16" fill="none" stroke="#fff" stroke-width="3.5" stroke-linecap="round"/><path d="M12 26l20-10 20 10" fill="none" stroke="#fff" stroke-width="3.5" stroke-linejoin="round"/><path d="M44 48l8-30" stroke="#f5d48a" stroke-width="3" stroke-linecap="round"/>',
    reformer: '<path d="M16 28v10l22 8V20z" fill="#fff"/><path d="M38 20v26M44 26c4 2 4 12 0 14" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round"/><path d="M20 38l3 9h6l-3-8" fill="#f5d48a"/>',
    watchdog: '<path d="M10 32c6-10 14-15 22-15s16 5 22 15c-6 10-14 15-22 15S16 42 10 32z" fill="none" stroke="#fff" stroke-width="3.5"/><circle cx="32" cy="32" r="7" fill="#f5d48a"/>',
    compromiser: '<path d="M32 14v34M18 48h28" stroke="#fff" stroke-width="3.5" stroke-linecap="round"/><path d="M14 22h36" stroke="#fff" stroke-width="3" stroke-linecap="round"/><path d="M14 22l-6 12h12zM50 22l-6 12h12z" fill="#f5d48a"/>',
    pragmatist: '<circle cx="32" cy="32" r="17" fill="none" stroke="#fff" stroke-width="3.5"/><path d="M32 18l5 14-5 14-5-14z" fill="#f5d48a"/>',
    bystander: '<circle cx="32" cy="20" r="6" fill="#fff"/><path d="M26 30h12l-2 12h-8z" fill="#fff"/><path d="M14 44h36M18 44v8M46 44v8" stroke="#f5d48a" stroke-width="3.5" stroke-linecap="round"/>'
  };
  function personalityBlock() {
    const P = GAME.personality, key = personalityFor(S.picks), t = P.types[key], c = counts(S.picks);
    const box = h("section", "persona " + key);
    const head = h("div", "persona-head");
    head.appendChild(h("div", "badge", '<svg viewBox="0 0 64 64" aria-hidden="true">' + BADGE[key] + "</svg>"));
    const titles = h("div");
    titles.appendChild(h("div", "persona-label", P.label));
    titles.appendChild(h("div", "persona-name", t.name));
    titles.appendChild(h("div", "persona-tag", t.tagline));
    head.appendChild(titles);
    box.appendChild(head);
    box.appendChild(h("p", "persona-text", t.text));
    const traits = h("div", "traits");
    ["duty", "balance", "self"].forEach(k => {
      const pct = Math.round(c[k] / Math.max(1, S.picks.length) * 100);
      traits.appendChild(h("div", "trait " + k, '<div class="trait-top"><span>' + P.traits[k] + "</span><span>" + c[k] + '</span></div><div class="trait-bar"><i style="width:' + pct + '%"></i></div>'));
    });
    box.appendChild(traits);
    const facts = h("div", "persona-facts");
    [[P.strengthLabel, t.strength], [P.blindLabel, t.blind], [P.historyLabel, t.history]].forEach(([l, v]) => {
      const f = h("div"); f.appendChild(h("b", null, l)); f.appendChild(document.createTextNode(v)); facts.appendChild(f);
    });
    box.appendChild(facts);
    box.appendChild(h("p", "persona-basis", P.basedOn.replace("{duty}", c.duty).replace("{balance}", c.balance).replace("{self}", c.self)));
    return box;
  }
  function finish() {
    S.mode = "end"; hurrying = false; S.finishedAt = performance.now();
    const Eg = GAME.ending, total = score();
    const scr = h("div", "screen"), panel = h("div", "panel");
    panel.appendChild(h("h1", null, UI.journeyTitle));
    panel.appendChild(personalityBlock());
    const row = h("div", "score-row");
    const C = 2 * Math.PI * 60;
    const ring = h("div", "ring", '<svg viewBox="0 0 140 140" aria-hidden="true"><circle class="track" cx="70" cy="70" r="60" fill="none" stroke-width="12"/><circle class="arc" cx="70" cy="70" r="60" fill="none" stroke-width="12" stroke-linecap="round" stroke-dasharray="' + C.toFixed(1) + '" stroke-dashoffset="' + C.toFixed(1) + '"/></svg><div class="num"><div><b data-score>0</b><small>' + UI.scoreOutOf + '</small></div></div><div class="lbl">' + UI.scoreLabel + "</div>");
    ring.setAttribute("aria-label", UI.scoreLabel + " " + total + " " + UI.scoreOutOf);
    row.appendChild(ring);
    const finals = h("div", "finals");
    ["duty", "time", "money", "trust"].forEach(key => {
      const f = h("div", "r"); f.dataset.k = key;
      f.innerHTML = '<div class="r-top"><span>' + UI.resources[key] + '</span><span class="r-val">' + S.res[key] + '</span></div><div class="r-bar"><div class="r-fill" style="width:' + S.res[key] + '%"></div></div>';
      finals.appendChild(f);
    });
    row.appendChild(finals);
    panel.appendChild(row);

    const kinds = S.picks.reduce((a, p) => (a[p.kind] = (a[p.kind] || 0) + 1, a), {});
    const parts = [S.res.duty >= 70 ? Eg.duty.high : S.res.duty >= 40 ? Eg.duty.mid : Eg.duty.low];
    if ((kinds.balance || 0) >= 2 && S.res.duty >= 40) parts.push(Eg.balanceNote);
    parts.push(S.res.trust >= 65 ? Eg.trust.high : S.res.trust >= 35 ? Eg.trust.mid : Eg.trust.low, Eg.jury[S.jury] || "");
    panel.appendChild(h("p", "pattern", parts.filter(Boolean).join(" ")));
    panel.appendChild(h("p", "conclusion", Eg.conclusion));
    panel.appendChild(h("p", "section-label", UI.actionsLabel));
    const acts = h("ol", "actions"); Eg.actions.forEach(a => acts.appendChild(h("li", null, a))); panel.appendChild(acts);
    panel.appendChild(h("p", "section-label", UI.decisionsLabel));
    const path = h("ul", "path");
    S.picks.forEach(p => { const li = h("li", p.kind); li.textContent = p.place + ": " + p.label; path.appendChild(li); });
    panel.appendChild(path);
    panel.appendChild(h("div", "definition", '<div class="dl">' + GAME.definition.label + '</div><div class="dt">' + GAME.definition.text + "</div>"));
    panel.appendChild(h("p", "note", Eg.scoreNote));
    panel.appendChild(sourcesBlock());
    const again = h("button", "primary", UI.playAgain); again.type = "button";
    again.addEventListener("click", reset);
    panel.appendChild(again);
    scr.appendChild(panel); layer.appendChild(scr);
    requestAnimationFrame(() => requestAnimationFrame(() => { ring.querySelector(".arc").style.strokeDashoffset = (C * (1 - total / 100)).toFixed(1); }));
    const num = ring.querySelector("[data-score]"), t0 = performance.now();
    (function tick(now) { const p = clamp((now - t0) / 900, 0, 1); num.textContent = Math.round(total * (1 - Math.pow(1 - p, 3))); if (p < 1) requestAnimationFrame(tick); })(t0);
  }
  function sourcesBlock() {
    const SRC = GAME.sources, d = h("details", "sources");
    d.appendChild(h("summary", null, UI.sourcesLabel));
    [[UI.citedLabel, SRC.cited], [UI.consultedLabel, SRC.consulted]].forEach(([lab, list]) => {
      d.appendChild(h("h2", null, lab));
      const ul = h("ul");
      list.forEach(s => { const li = h("li", null, s.text + " "); const a = h("a", null, SRC.linkText); a.href = s.url; a.target = "_blank"; a.rel = "noopener"; li.appendChild(a); ul.appendChild(li); });
      d.appendChild(ul);
    });
    return d;
  }

  /* ================= Boot ================= */
  function reset() {
    clearTimeout(resultTimer); hurrying = false;
    worldEl.classList.remove("dim");
    worldEl.querySelectorAll(".banner").forEach(n => n.remove());
    S = fresh();
    updateHud();
    setEra(0, false);
    showStart();
  }
  buildHud();
  buildTimeline();
  resize();
  window.addEventListener("resize", resize);
  reset();
  requestAnimationFrame(frame);

  /* Read only view of the game state for automated testing. */
  window.__duty = { get state() { return S; }, encX, endX: END_X, tuning: TUNING,
    step(seconds) { for (let s = 0; s < seconds; s += 0.02) update(0.02); } };
})();
</script>
</body>
</html>
