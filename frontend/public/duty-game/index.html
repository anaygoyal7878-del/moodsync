<style>
  :root {

  .definition {

  }
  .definition .dl { font-size: .72rem; font-weight: 800; letter-spacing: .16em; color: var(--red); }
  .definition .dt { font-family: var(--serif); font-size: 1.2rem; line-height: 1.35; margin-top: 2px; }

  /* ---------- Character cards ---------- */
  .chars { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; }
  .char {

  .c-text { font-family: var(--serif); font-size: 1.08rem; line-height: 1.4; margin-top: 4px; }
  .c-after { font-size: .95rem; margin-top: 8px; padding-top: 8px; border-top: 1px dashed var(--brown-light); color: var(--navy-soft); }
  .c-echo { font-size: .95rem; margin-top: 8px; font-weight: 700; }
  .deltas { display: flex !important; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
  .chip { font-size: .76rem; font-weight: 800; letter-spacing: .05em; padding: 4px 10px; border-radius: 99px; color: #fff; }
  .chip.up { background: var(--green); }
  .chip.down { background: var(--red); }
  .c-foot { display: flex !important; align-items: center; gap: 10px; margin-top: 10px; font-size: .75rem; color: var(--navy-soft); }
  .timer { flex: 1; height: 4px; border-radius: 99px; background: var(--edge); overflow: hidden; }
  .timer i { display: block; height: 100%; background: var(--navy); transform-origin: left; animation: drain linear forwards; }
  @keyframes drain { from { transform: scaleX(1); } to { transform: scaleX(0); } }

  /* ---------- Steps ---------- */
  .steps { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin: 14px 0 0; padding: 0; list-style: none; }
  .steps li {
    position: relative; padding: 16px 14px 14px; text-align: center;
    background: var(--cream); border: 1.5px solid var(--brown-light); border-radius: var(--radius);
    font-weight: 600; font-size: .98rem; line-height: 1.35;
  }
  .steps .num {
    display: grid; place-items: center; width: 40px; height: 40px; margin: 0 auto 8px;
    border-radius: 50%; background: var(--red); color: #fff; font-family: var(--serif); font-weight: 700; font-size: 1.25rem;
  }
  .steps svg { display: block; width: 34px; height: 34px; margin: 0 auto 6px; }

  /* ---------- Ending ---------- */
  .score-wrap { display: flex; align-items: center; justify-content: center; gap: 22px; flex-wrap: wrap; }
  .ring { width: 150px; height: 150px; position: relative; flex: none; }
  .ring svg { width: 100%; height: 100%; transform: rotate(-90deg); }
  .ring .track { stroke: var(--edge); }
  .ring .arc { stroke: var(--red); transition: stroke-dashoffset .9s var(--ease); }
  .ring .num { position: absolute; inset: 0; display: grid; place-items: center; text-align: center; }
  .ring .num b { font-family: var(--serif); font-size: 2.8rem; line-height: 1; display: block; }
  .ring .num small { font-weight: 800; letter-spacing: .08em; color: var(--navy-soft); }
  .score-label { font-weight: 800; letter-spacing: .14em; font-size: .8rem; color: var(--red); }
  .score-name { font-family: var(--serif); font-size: 1.5rem; font-weight: 700; }
  .judgment { font-family: var(--serif); font-size: 1.08rem; line-height: 1.5; margin: 0; padding: 14px 18px; border-left: 4px solid var(--red); background: var(--cream); border-radius: 0 12px 12px 0; }
  .note { margin: 0; font-size: .85rem; color: var(--navy-soft); text-align: center; }
  .path { display: flex; flex-wrap: wrap; gap: 6px; justify-content: center; margin: 0; padding: 0; list-style: none; }
  .path li { font-size: .74rem; font-weight: 700; letter-spacing: .04em; padding: 4px 10px; border-radius: 99px; background: var(--edge); }

  .sources { background: var(--cream-2); border: 1.5px solid var(--brown-light); border-radius: 12px; padding: 10px 16px; }
  .sources summary { cursor: pointer; font-weight: 800; letter-spacing: .14em; font-size: .8rem; color: var(--red); }
  .sources h2 { font-family: var(--serif); font-size: 1.05rem; margin: 12px 0 6px; }
  .sources ul { list-style: none; margin: 0; padding: 0; }
  .sources li { font-family: var(--serif); font-size: .92rem; line-height: 1.45; padding-left: 2em; text-indent: -2em; margin-bottom: 8px; }
  .sources a { font-family: var(--sans); font-size: .78rem; font-weight: 700; color: var(--red); white-space: nowrap; }

  /* ---------- IT IS NOW splash ---------- */
  .splash {
    position: fixed; inset: 0; z-index: 20; display: grid; place-items: center;
    background: var(--navy); color: var(--cream-2);
    font-family: var(--serif); font-weight: 700; font-size: clamp(2.6rem, 11vw, 6rem); letter-spacing: .04em;
    animation: splash 1s ease forwards; pointer-events: none;
  }
  .splash span { animation: splashText 1s var(--ease) forwards; }
  @keyframes splash { 0% { opacity: 0; } 20% { opacity: 1; } 80% { opacity: 1; } 100% { opacity: 0; } }
  @keyframes splashText { 0% { transform: scale(.92); letter-spacing: .3em; } 60% { transform: none; letter-spacing: .04em; } }

  /* ---------- Small screens ---------- */
  @media (max-width: 720px) {
    body { font-size: 16px; }
    .hud { grid-template-columns: 1fr auto; grid-template-areas: "who prog" "res res"; padding: 8px 14px 10px; gap: 8px 10px; }
    .who { grid-area: who; } .progress { grid-area: prog; } .res { grid-area: res; justify-content: space-between; gap: 10px; }
    .r { flex: 1; min-width: 0; }
    .r-top .long { display: none; } .r-top .short { display: inline; }
    #stage { padding: 14px 16px 18px; gap: 12px; }
    .panel { padding: 14px 16px 16px; }
    .chars { grid-template-columns: 1fr; gap: 8px; }
    .char { flex-direction: row; text-align: left; padding: 10px 12px; gap: 12px; }
    .char .pic { width: 56px; height: 56px; }
    .char-body { align-items: flex-start; gap: 3px; }
    .perks { justify-content: flex-start; }
    .actions { grid-template-columns: 1fr; }
    .steps { grid-template-columns: 1fr; gap: 8px; }
    .steps li { display: flex; align-items: center; gap: 12px; text-align: left; padding: 10px 12px; }
    .steps .num { margin: 0; flex: none; width: 34px; height: 34px; font-size: 1.05rem; }
    .steps svg { display: none; }
    .art svg { max-height: 20vh; }
    .stakes { gap: 4px; font-size: .62rem; letter-spacing: .05em; }
    .stakes li { padding: 2px 7px; }
  }
  @media (max-height: 700px) and (min-width: 721px) {
    .art svg { max-height: 20vh; }
    h1 { font-size: 2rem; }
  }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation-duration: .01ms !important; transition-duration: .01ms !important; }
  }
</style>
</head>
<body>
<div class="game">
  <header class="hud">
    <div class="who">
      <div class="portrait" id="hudPortrait" aria-hidden="true"></div>
      <div style="min-width:0">
        <div class="brand" id="hudBrand"></div>
        <div class="pname" id="hudName"></div>
      </div>
    </div>
    <div class="progress" id="progress" aria-label="Screen progress"></div>
    <div class="res" id="res"></div>
  </header>
  <div class="stage-wrap" id="stageWrap">
    <main id="stage" aria-live="polite"></main>
  </div>
</div>

<script>
(function () {
  "use strict";
  const UI = GAME.ui;
  const KEYS = ["time", "money", "trust"];
  const ORDER = ["start", "april", "cost", "who", "now", "action", "final"];
  const stage = document.getElementById("stage");
  const stageWrap = document.getElementById("stageWrap");

  /* ---------- Illustrations (inline SVG, no external files) ---------- */
  const N = "#1c2a44", C = "#fbf6ea", E = "#e8d9b6", R = "#a23e2e", B = "#8a6a44", BL = "#cbb086";
  const ART = {
    farmer:
      '<svg viewBox="0 0 80 80" aria-hidden="true"><rect width="80" height="80" fill="' + E + '"/>' +
      '<path d="M16 80c0-15 10-24 24-24s24 9 24 24z" fill="#5f7a52" stroke="' + N + '" stroke-width="2"/>' +
      '<circle cx="40" cy="41" r="12" fill="#f0d9b5" stroke="' + N + '" stroke-width="2"/>' +
      '<ellipse cx="40" cy="31" rx="21" ry="4.5" fill="#caa55c" stroke="' + N + '" stroke-width="2"/>' +
      '<path d="M30 31c0-9 4-13 10-13s10 4 10 13z" fill="#caa55c" stroke="' + N + '" stroke-width="2"/>' +
      '<path d="M67 34v46M61 24v10h12V24M67 24v10" fill="none" stroke="' + N + '" stroke-width="2.5" stroke-linecap="round"/></svg>',
    shopkeeper:
      '<svg viewBox="0 0 80 80" aria-hidden="true"><rect width="80" height="80" fill="' + E + '"/>' +
      '<path d="M16 80c0-15 10-24 24-24s24 9 24 24z" fill="#44506a" stroke="' + N + '" stroke-width="2"/>' +
      '<path d="M31 60h18v20H31z" fill="' + C + '" stroke="' + N + '" stroke-width="1.5"/>' +
      '<circle cx="40" cy="41" r="12" fill="#f0d9b5" stroke="' + N + '" stroke-width="2"/>' +
      '<circle cx="35.5" cy="42" r="3" fill="none" stroke="' + N + '" stroke-width="1.5"/><circle cx="44.5" cy="42" r="3" fill="none" stroke="' + N + '" stroke-width="1.5"/>' +
      '<path d="M38.5 42h3" stroke="' + N + '" stroke-width="1.5"/>' +
      '<path d="M21 33L40 20l19 13q-19 -5 -38 0z" fill="' + N + '" stroke="' + N + '" stroke-width="2" stroke-linejoin="round"/></svg>',
    apprentice:
      '<svg viewBox="0 0 80 80" aria-hidden="true"><rect width="80" height="80" fill="' + E + '"/>' +
      '<path d="M16 80c0-15 10-24 24-24s24 9 24 24z" fill="' + R + '" stroke="' + N + '" stroke-width="2"/>' +
      '<circle cx="40" cy="42" r="12" fill="#f0d9b5" stroke="' + N + '" stroke-width="2"/>' +
      '<path d="M27 36c0-11 6-16 14-16 8 0 14 4 15 12-5 0-8 1-10 4z" fill="' + N + '" stroke="' + N + '" stroke-width="2" stroke-linejoin="round"/>' +
      '<path d="M63 46l9 32" stroke="' + B + '" stroke-width="3.5" stroke-linecap="round"/>' +
      '<rect x="55" y="39" width="16" height="8" rx="1.5" transform="rotate(-16 63 43)" fill="' + N + '"/></svg>',

    april:
      '<svg viewBox="0 0 480 170" aria-hidden="true">' +
      '<circle cx="410" cy="42" r="20" fill="' + E + '"/>' +
      '<path d="M0 124Q120 84 240 112T480 102V170H0z" fill="#e3d2a8" stroke="' + N + '" stroke-width="2"/>' +
      '<path d="M0 150Q160 128 300 146T480 140V170H0z" fill="#d6c092"/>' +
      '<path d="M50 76L96 44l46 32z" fill="' + N + '"/><rect x="58" y="76" width="76" height="52" fill="' + R + '" stroke="' + N + '" stroke-width="2"/>' +
      '<rect x="84" y="96" width="24" height="32" fill="' + C + '" stroke="' + N + '" stroke-width="2"/><path d="M84 96l24 32M108 96l-24 32" stroke="' + N + '" stroke-width="1.5"/>' +
      '<path d="M150 118h110M150 128h110" stroke="' + B + '" stroke-width="2"/>' +
      [158, 182, 206, 230, 254].map(x => '<path d="M' + x + ' 110v24" stroke="' + B + '" stroke-width="3"/>').join("") +
      '<rect x="296" y="72" width="16" height="30" fill="' + C + '" stroke="' + N + '" stroke-width="2"/><path d="M292 72l12 -24 12 24z" fill="' + N + '"/>' +
      [340, 368, 396, 424, 452].map(x =>
        '<g transform="translate(' + x + ' 128)" stroke="' + N + '" stroke-width="2.2" stroke-linecap="round" fill="none">' +
        '<circle cx="0" cy="-38" r="5" fill="#f0d9b5"/><path d="M-8 -42L0 -49 8 -42z" fill="' + N + '"/>' +
        '<path d="M0 -33V-14M0 -14L-5 0M0 -14L5 0M0 -28L-6 -20"/><path d="M-1 -28L11 -54" stroke="' + B + '" stroke-width="2.6"/></g>').join("") +
      '</svg>',

    cost:
      '<svg viewBox="0 0 480 170" aria-hidden="true">' +
      '<rect x="60" y="54" width="130" height="96" rx="4" fill="' + BL + '" stroke="' + N + '" stroke-width="2"/>' +
      '<path d="M60 78h130M60 126h130" stroke="' + B + '" stroke-width="2"/>' +
      '<text x="125" y="73" text-anchor="middle" font-family="Georgia,serif" font-weight="700" font-size="18" letter-spacing="4" fill="' + N + '">TEA</text>' +
      '<g transform="rotate(-10 125 104)"><rect x="70" y="88" width="112" height="32" rx="4" fill="' + C + '" fill-opacity=".6" stroke="' + R + '" stroke-width="3"/>' +
      '<text x="126" y="111" text-anchor="middle" font-family="system-ui,sans-serif" font-weight="800" font-size="17" letter-spacing="2" fill="' + R + '">BOYCOTT</text></g>' +
      '<g fill="' + E + '" stroke="' + N + '" stroke-width="2"><ellipse cx="240" cy="140" rx="20" ry="6"/><ellipse cx="240" cy="132" rx="20" ry="6"/><ellipse cx="240" cy="124" rx="20" ry="6"/></g>' +
      '<g stroke="' + N + '" stroke-width="2.2" fill="none" stroke-linecap="round">' +
      '<circle cx="360" cy="84" r="48"/><circle cx="360" cy="84" r="6" fill="' + N + '"/>' +
      [0, 30, 60, 90, 120, 150].map(a => { const r = a * Math.PI / 180; return '<path d="M' + (360 + 48 * Math.cos(r)).toFixed(1) + ' ' + (84 + 48 * Math.sin(r)).toFixed(1) + 'L' + (360 - 48 * Math.cos(r)).toFixed(1) + ' ' + (84 - 48 * Math.sin(r)).toFixed(1) + '"/>'; }).join("") +
      '<path d="M330 150l30 -66 30 66M300 150h120"/><path d="M420 150V70l20 -10" stroke="' + B + '"/></g></svg>',

    who:
      '<svg viewBox="0 0 480 170" aria-hidden="true"><g stroke="' + C + '" stroke-width="2.5" fill="none" stroke-linecap="round">' +
      '<path d="M240 26V150M200 152h80"/><circle cx="240" cy="24" r="6" fill="' + C + '"/>' +
      '<path d="M140 70L340 34"/>' +
      '<path d="M140 70l-30 44M140 70l30 44M340 34l-30 44M340 34l30 44"/></g>' +
      '<path d="M100 114h80q-6 18 -40 18t-40 -18z" fill="' + R + '" stroke="' + C + '" stroke-width="2"/>' +
      '<path d="M300 78h80q-6 18 -40 18t-40 -18z" fill="' + E + '" stroke="' + C + '" stroke-width="2"/>' +
      '<text x="140" y="154" text-anchor="middle" font-family="system-ui,sans-serif" font-weight="800" font-size="15" letter-spacing="3" fill="' + C + '">DUTY</text>' +
      '<text x="340" y="118" text-anchor="middle" font-family="system-ui,sans-serif" font-weight="800" font-size="15" letter-spacing="3" fill="' + C + '">RIGHTS</text></svg>',

    now:
      '<svg viewBox="0 0 480 170" aria-hidden="true">' +
      '<g transform="rotate(-5 140 90)"><rect x="60" y="36" width="160" height="104" rx="6" fill="' + C + '" stroke="' + N + '" stroke-width="2.2"/>' +
      '<path d="M60 40l80 54 80 -54" fill="none" stroke="' + N + '" stroke-width="2"/>' +
      '<text x="140" y="128" text-anchor="middle" font-family="system-ui,sans-serif" font-weight="800" font-size="14" letter-spacing="2" fill="' + N + '">JURY SUMMONS</text>' +
      '<circle cx="140" cy="94" r="11" fill="' + R + '"/></g>' +
      '<rect x="272" y="26" width="150" height="126" rx="8" fill="' + C + '" stroke="' + N + '" stroke-width="2.2"/>' +
      '<path d="M272 34a8 8 0 0 1 8 -8h134a8 8 0 0 1 8 8v22H272z" fill="' + R + '"/>' +
      '<text x="347" y="48" text-anchor="middle" font-family="system-ui,sans-serif" font-weight="800" font-size="14" letter-spacing="3" fill="#fff">FRIDAY</text>' +
      '<text x="288" y="86" font-family="system-ui,sans-serif" font-weight="700" font-size="14" fill="' + N + '">9:00  Jury duty</text>' +
      '<text x="288" y="120" font-family="system-ui,sans-serif" font-weight="700" font-size="14" fill="' + N + '">9:00  Work shift</text>' +
      '<path d="M284 98h124" stroke="' + BL + '" stroke-width="1.5"/>' +
      '<circle cx="436" cy="100" r="16" fill="' + R + '" stroke="' + N + '" stroke-width="2"/>' +
      '<text x="436" y="107" text-anchor="middle" font-family="Georgia,serif" font-weight="700" font-size="20" fill="#fff">!</text></svg>',

    stepIcons: [
      '<svg viewBox="0 0 32 32" aria-hidden="true"><circle cx="13" cy="13" r="8" fill="none" stroke="' + N + '" stroke-width="2.5"/><path d="M19 19l8 8" stroke="' + N + '" stroke-width="3" stroke-linecap="round"/></svg>',
      '<svg viewBox="0 0 32 32" aria-hidden="true"><rect x="6" y="4" width="20" height="24" rx="3" fill="none" stroke="' + N + '" stroke-width="2.2"/><path d="M10 12l2 2 4 -4M10 20l2 2 4 -4M19 12h3M19 20h3" fill="none" stroke="' + N + '" stroke-width="2" stroke-linecap="round"/></svg>',
      '<svg viewBox="0 0 32 32" aria-hidden="true"><path d="M6 26l2 -6L22 6l4 4L12 24z" fill="none" stroke="' + N + '" stroke-width="2.2" stroke-linejoin="round"/><path d="M19 9l4 4" stroke="' + N + '" stroke-width="2"/></svg>'
    ]
  };

  /* ---------- State ---------- */
  let S, advanceTimer = null, busy = false, navToken = 0;
  function fresh() {
    return { char: null, name: UI.defaultName, res: { time: 50, money: 50, trust: 50 }, points: 0, cost: 0, picks: {}, path: [] };
  }

  /* ---------- Helpers ---------- */
  function h(tag, cls, html) {
    const n = document.createElement(tag);
    if (cls) n.className = cls;
    if (html != null) n.innerHTML = html;
    return n;
  }
  function esc(s) { return String(s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c])); }
  function fill(s) {
    const ch = S.char ? GAME.characters.find(c => c.id === S.char) : null;
    return s.replace(/\{work\}/g, ch ? ch.work : "home").replace(/\{name\}/g, esc(S.name));
  }
  function clamp(v) { return Math.max(0, Math.min(100, v)); }
  function deltaText(k, d) { return UI.resourcesShort[k] + " " + (d > 0 ? UI.plus : UI.minus) + " " + Math.abs(d); }

  /* ---------- HUD ---------- */
  function buildHud() {
    document.getElementById("hudBrand").textContent = UI.brand;
    const res = document.getElementById("res");
    KEYS.forEach(k => {
      const r = h("div", "r");
      r.dataset.k = k;
      r.innerHTML = '<div class="r-top"><span><span class="long">' + UI.resources[k] + '</span><span class="short">' + UI.resourcesShort[k] +
        '</span></span><span class="r-val"></span></div><div class="r-bar"><div class="r-fill"></div></div>';
      res.appendChild(r);
    });
  }
  function updateHud() {
    document.getElementById("hudName").textContent = S.name;
    const p = document.getElementById("hudPortrait");
    p.innerHTML = S.char ? ART[S.char] : "";
  }
  function paintRes(k, v) {
    const r = document.querySelector('.r[data-k="' + k + '"]');
    r.querySelector(".r-fill").style.width = v + "%";
    r.querySelector(".r-val").textContent = v;
    r.setAttribute("aria-label", UI.resources[k] + " " + v + " of 100");
  }
  function animateTo(target, showFloats) {
    KEYS.forEach(k => {
      const from = S.res[k], to = clamp(target[k]), d = to - from;
      S.res[k] = to;
      const r = document.querySelector('.r[data-k="' + k + '"]');
      r.querySelector(".r-fill").style.width = to + "%";
      if (showFloats && d !== 0) {
        const f = h("span", "float " + (d > 0 ? "up" : "down"), (d > 0 ? UI.plus : UI.minus) + " " + Math.abs(d));
        r.appendChild(f);
        setTimeout(() => f.remove(), 1200);
      }
      const t0 = performance.now(), val = r.querySelector(".r-val");
      (function tick(now) {
        const p = Math.max(0, Math.min(1, (now - t0) / Math.max(1, TIMING.count)));
        val.textContent = Math.round(from + d * (1 - Math.pow(1 - p, 3)));
        if (p < 1) requestAnimationFrame(tick); else paintRes(k, to);
      })(t0);
    });
  }

  /* ---------- Screen flow ---------- */
  function go(id) {
    clearTimeout(advanceTimer);
    const idx = ORDER.indexOf(id);
    document.getElementById("progress").textContent = (idx + 1) + " / " + ORDER.length;
    const token = ++navToken;
    const draw = () => {
      if (token !== navToken) return;
      stage.innerHTML = "";
      stage.classList.remove("out", "in");
      if (id === "start") renderStart();
      else if (id === "final") renderFinal();
      else renderScene(id);
      void stage.offsetWidth;
      stage.classList.add("in");
      stageWrap.scrollTop = 0;
      const h1 = stage.querySelector("h1");
      if (h1) h1.focus({ preventScroll: true });
      busy = false;
    };
    busy = true;
    if (!stage.childElementCount) return draw();
    stage.classList.remove("in");
    stage.classList.add("out");
    setTimeout(() => {
      if (id === "now") return splash(draw);
      draw();
    }, TIMING.sceneOut);
  }
  function splash(then) {
    const s = h("div", "splash", "<span>" + UI.nowSplash + "</span>");
    s.style.animationDuration = TIMING.splash + "ms";
    s.firstChild.style.animationDuration = TIMING.splash + "ms";
    document.body.appendChild(s);
    setTimeout(then, TIMING.splash * 0.55);
    setTimeout(() => s.remove(), TIMING.splash);
  }

  /* ---------- Screen 1 ---------- */
  function renderStart() {
    const sc = GAME.screens.start;
    const panel = h("section", "panel");
    const h1 = h("h1", null, sc.heading); h1.tabIndex = -1; panel.appendChild(h1);

    const nameRow = h("div", "name-row");
    const input = h("input", "name-input");
    input.type = "text"; input.maxLength = 18; input.placeholder = UI.namePlaceholder; input.autocomplete = "off";
    input.setAttribute("aria-label", UI.namePlaceholder);
    input.addEventListener("input", () => {
      const v = input.value.trim();
      S.name = v ? v.toUpperCase() : UI.defaultName;
      updateHud();
    });
    nameRow.appendChild(input);
    panel.appendChild(nameRow);

    const chars = h("div", "chars");
    chars.style.marginTop = "12px";
    chars.setAttribute("role", "radiogroup");
    GAME.characters.forEach(c => {
      const b = h("button", "char");
      b.type = "button";
      b.setAttribute("role", "radio");
      b.setAttribute("aria-checked", "false");
      b.innerHTML = '<div class="pic">' + ART[c.id] + '</div><div class="char-body"><div class="cn">' + c.name + '</div><div class="cl">' + c.line +
        '</div><div class="perks">' + c.perks.map(p => '<span class="perk">' + p + '</span>').join("") + '</div></div>';
      b.addEventListener("click", () => {
        S.char = c.id;
        chars.querySelectorAll(".char").forEach(x => { x.classList.toggle("sel", x === b); x.setAttribute("aria-checked", x === b ? "true" : "false"); });
        animateTo(c.start, false);
        updateHud();
        begin.disabled = false;
        begin.textContent = UI.begin;
      });
      chars.appendChild(b);
    });
    panel.appendChild(chars);
    stage.appendChild(panel);

    const def = h("div", "definition", '<div class="dl">' + GAME.definition.label + '</div><div class="dt">' + GAME.definition.text + '</div>');
    stage.appendChild(def);
    const ctx = h("p", "context", sc.context);
    stage.appendChild(ctx);
    stage.appendChild(h("p", "source", '<span>FOUNDING SOURCE</span>' + sc.source));

    const begin = h("button", "primary", UI.pickPrompt);
    begin.type = "button";
    begin.disabled = true;
    begin.addEventListener("click", () => { if (S.char && !busy) go("april"); });
    stage.appendChild(begin);
  }

  /* ---------- Decision screens ---------- */
  function renderScene(id) {
    const sc = GAME.screens[id];
    const panel = h("section", "panel" + (sc.variant === "dark" ? " dark" : ""));
    const stakes = h("ol", "stakes");
    UI.stakes.forEach((s, i) => stakes.appendChild(h("li", sc.stakes.includes(i) ? "on" : "", s)));
    stakes.setAttribute("aria-label", "Rising stakes");
    panel.appendChild(stakes);
    if (ART[id]) panel.appendChild(h("div", "art", ART[id]));
    panel.appendChild(h("p", "stage-tag", sc.stage));
    const h1 = h("h1", null, sc.heading); h1.tabIndex = -1; panel.appendChild(h1);
    panel.appendChild(h("p", "text", fill(sc.text)));
    if (sc.source) panel.appendChild(h("p", "source", '<span>FOUNDING SOURCE</span>' + sc.source));
    if (sc.question) panel.appendChild(h("p", "question", sc.question));
    if (sc.steps) {
      const ol = h("ol", "steps");
      sc.steps.forEach((t, i) => ol.appendChild(h("li", null, '<div class="num">' + (i + 1) + '</div>' + ART.stepIcons[i] + '<div>' + t + '</div>')));
      panel.appendChild(ol);
    }
    stage.appendChild(panel);

    const actions = h("div", "actions" + (sc.variant === "dark" ? " dark-actions" : ""));
    sc.choices.forEach(c => {
      const b = h("button", "choice", c.label);
      b.type = "button";
      b.addEventListener("click", () => choose(id, sc, c, b, actions));
      actions.appendChild(b);
    });
    stage.appendChild(actions);
  }

  function choose(id, sc, c, btn, actions) {
    if (actions.dataset.locked) return;
    actions.dataset.locked = "1";
    actions.querySelectorAll(".choice").forEach(b => { b.disabled = true; b.classList.add(b === btn ? "picked" : "dim"); });

    const target = {};
    KEYS.forEach(k => target[k] = S.res[k] + (c.effects[k] || 0));
    animateTo(target, true);
    S.points += c.points;
    if (c.points >= 10) KEYS.forEach(k => { if ((c.effects[k] || 0) < 0 && k !== "trust") S.cost += -c.effects[k]; });
    S.picks[id] = c;
    S.path.push(c.title);

    setTimeout(() => {
      actions.innerHTML = "";
      const card = h("button", "conseq");
      card.type = "button";
      card.appendChild(h("span", "c-title", c.title));
      card.appendChild(h("span", "c-text", fill(c.text)));
      if (sc.after) card.appendChild(h("span", "c-after", sc.after));
      if (sc.echo && S.picks.april) {
        card.appendChild(h("span", "c-echo", sc.echo.replace("{then}", S.picks.april.echo).replace("{now}", c.echo)));
      }
      const chips = h("span", "deltas");
      KEYS.forEach(k => {
        const d = c.effects[k] || 0;
        if (d) chips.appendChild(h("span", "chip " + (d > 0 ? "up" : "down"), deltaText(k, d)));
      });
      card.appendChild(chips);
      const hold = sc.long ? TIMING.holdLong : TIMING.hold;
      const foot = h("span", "c-foot", '<span class="timer"><i style="animation-duration:' + hold + 'ms"></i></span><span>' + UI.tapToContinue + '</span>');
      card.appendChild(foot);
      actions.appendChild(card);
      card.focus({ preventScroll: true });
      card.scrollIntoView({ block: "nearest", behavior: "smooth" });
      const next = ORDER[ORDER.indexOf(id) + 1];
      let done = false;
      const advance = () => { if (done) return; done = true; busy = false; go(next); };
      card.addEventListener("click", advance);
      advanceTimer = setTimeout(advance, hold);
    }, TIMING.feedback);
  }

  /* ---------- Final screen ---------- */
  function score() {
    const costPts = Math.min(15, Math.round(S.cost * 15 / 50));
    return Math.max(0, Math.min(100, S.points + costPts));
  }
  function renderFinal() {
    const E = GAME.ending, total = score();
    const panel = h("section", "panel");
    const wrap = h("div", "score-wrap");
    const C2 = 2 * Math.PI * 64;
    const ring = h("div", "ring",
      '<svg viewBox="0 0 150 150" aria-hidden="true"><circle class="track" cx="75" cy="75" r="64" fill="none" stroke-width="12"/>' +
      '<circle class="arc" cx="75" cy="75" r="64" fill="none" stroke-width="12" stroke-linecap="round" stroke-dasharray="' + C2.toFixed(1) + '" stroke-dashoffset="' + C2.toFixed(1) + '"/></svg>' +
      '<div class="num"><div><b>0</b><small>/ 100</small></div></div>');
    wrap.appendChild(ring);
    const lab = h("div");
    lab.appendChild(h("div", "score-label", E.scoreLabel));
    const nm = h("div", "score-name"); nm.textContent = S.name; lab.appendChild(nm);
    const h1 = h("h1", null, total + " / 100");
    h1.tabIndex = -1;
    h1.style.cssText = "position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)";
    lab.appendChild(h1);
    wrap.appendChild(lab);
    panel.appendChild(wrap);
    stage.appendChild(panel);

    requestAnimationFrame(() => requestAnimationFrame(() => {
      ring.querySelector(".arc").style.strokeDashoffset = (C2 * (1 - total / 100)).toFixed(1);
    }));
    const numEl = ring.querySelector("b"), t0 = performance.now();
    (function tick(now) {
      const p = Math.max(0, Math.min(1, (now - t0) / 900));
      numEl.textContent = Math.round(total * (1 - Math.pow(1 - p, 3)));
      if (p < 1) requestAnimationFrame(tick);
    })(t0);

    stage.appendChild(h("div", "definition", '<div class="dl">' + GAME.definition.label + '</div><div class="dt">' + GAME.definition.text + '</div>'));
    const jury = S.picks.now ? S.picks.now.id : "excused";
    stage.appendChild(h("p", "judgment", E.judgment.concat(E.juryLine[jury]).join(" ")));

    const path = h("ul", "path");
    S.path.forEach(t => path.appendChild(h("li", null, t)));
    stage.appendChild(path);
    stage.appendChild(h("p", "note", E.scoreNote));
    stage.appendChild(sourcesBlock());

    const again = h("button", "primary", UI.playAgain);
    again.type = "button";
    again.addEventListener("click", () => { if (!busy) start(); });
    stage.appendChild(again);
  }

  function sourcesBlock() {
    const SRC = GAME.sources;
    const d = h("details", "sources");
    d.appendChild(h("summary", null, SRC.label));
    [[SRC.citedLabel, SRC.cited], [SRC.consultedLabel, SRC.consulted]].forEach(([label, list]) => {
      d.appendChild(h("h2", null, label));
      const ul = h("ul");
      list.forEach(s => {
        const li = h("li", null, s.text + " ");
        const a = h("a", null, SRC.linkText);
        a.href = s.url; a.target = "_blank"; a.rel = "noopener";
        li.appendChild(a);
        ul.appendChild(li);
      });
      d.appendChild(ul);
    });
    return d;
  }

  /* ---------- Boot ---------- */
  function start() {
    S = fresh();
    KEYS.forEach(k => paintRes(k, S.res[k]));
    updateHud();
    go("start");
  }
  document.title = "Personal Duty";
  buildHud();
  start();
})();
</script>
</body>
</html>
